appId: com.havital.Havital.dev
# T-0094：onboarding intro 之後的「你從哪裡知道 Paceriz？」自報屏。
# 等待/防衛都收在這裡：出現時選 Threads 後繼續；沒出現（如 re-onboarding
# 從 PersonalBest 起）則整段跳過。呼叫端一律單行 runFlow，不要自帶 wait。
---
- extendedWaitUntil:
    visible:
      id: "AcquisitionChannel_Screen"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "AcquisitionChannel_Screen"
    commands:
      - tapOn:
          id: "AcquisitionChannelOption_threads"
      - tapOn:
          id: "OnboardingContinueButton"
