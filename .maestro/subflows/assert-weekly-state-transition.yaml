appId: com.havital.Havital.dev
---
# Guardrail helper: delete/regenerate should recover to a clean weekly-plan state.
# 接受主課表頁的任何狀態（有課表或需要回顧或需要課表）
- assertVisible:
    text: "每日訓練|Daily Training|Training Plan|需要完成上週回顧|需要產生週課表|訓練計畫"

# 用 Debug 工具刪除當前週課表（使用真實選單文字，不依賴座標）
- tapOn:
    id: "ellipsis.circle"
    optional: true
- tapOn:
    text: "更多|More|もっと見る"
    optional: true
- tapOn:
    text: "🐛 Debug 工具"
- tapOn:
    text: ".*刪除當前週課表.*"

# 等待主課表頁恢復（Beginner 刪除後顯示「需要完成上週回顧」或 race_run 顯示「需要產生週課表」）
- extendedWaitUntil:
    visible:
      text: "每日訓練|Daily Training|Training Plan|需要完成上週回顧|需要產生週課表|訓練計畫"
    timeout: 15000

# 直接在主課表頁點「取得週回顧」(Beginner 路徑) 或「產生週課表」(race_run 路徑)
- tapOn:
    text: "取得週回顧|取得週課表|取得下週課表|產生週課表|產生下週課表"
    optional: true

# 等待週回顧或週課表生成（Beginner 取得週回顧可能直接產生課表並顯示目標 sheet）
- extendedWaitUntil:
    visible:
      text: "訓練完成度|Training Completion|每日訓練|Daily Training|Training Plan|需要產生週課表|目標|教練的話"
    timeout: 60000

# 如果顯示「目標」sheet（Beginner 課表生成後自動彈出），先關閉
- tapOn:
    text: "關閉|Close"
    optional: true

# 如果到了週回顧頁（race_run 路徑），需要 scroll 到底部點「不套用/產生」
- scrollUntilVisible:
    element:
      text: "不套用調整，直接產生課表|套用|接受調整並產生下週課表|產生下週課表|產生週課表|Generate Next Week Plan|Generate Weekly Plan"
    direction: DOWN
    timeout: 20000
    optional: true

- tapOn:
    text: "不套用調整，直接產生課表|接受調整並產生下週課表|產生下週課表|產生週課表|Generate Next Week Plan|Generate Weekly Plan"
    optional: true

# 等待課表生成完成回到主課表頁
- extendedWaitUntil:
    visible:
      text: "每日訓練|Daily Training|Training Plan"
    timeout: 90000

- runFlow: ensure-main-training-screen.yaml
- runFlow: assert-weekly-plan-7days.yaml
