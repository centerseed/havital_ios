appId: com.havital.Havital.dev
---
# 子流程：新手方法論 (complete_10k / complete_5k) 課表品質驗證
# 依據：complete-10k-workout-spec.md / complete-5k-workout-spec.md
# 前提：在每日訓練頁面，課表已載入
# 驗證：
#   1. 不允許任何 tempo / threshold / interval 類刺激
#   2. 強度分布應為 100% low
#   3. 只有輕鬆跑和休息（conversion/base 階段特性）
#   4. 必須有休息日（至少 3 天休息）

# === 1. 禁止出現的高強度訓練類型 ===
- assertNotVisible:
    text: "間歇訓練"
    optional: false
- assertNotVisible:
    text: "節奏跑"
    optional: false
- assertNotVisible:
    text: "巡航間歇"
    optional: false
- assertNotVisible:
    text: "配速跑"
    optional: false
- assertNotVisible:
    text: "漸速跑"
    optional: false

# === 2. 必須有輕鬆跑 ===
- scrollUntilVisible:
    element: "輕鬆跑"
    direction: UP
    timeout: 10000
- assertVisible: "輕鬆跑"

# === 3. 強度分布驗證 ===
# 註：WeekOverviewCardV2 已改版 —— 強度不再用「週跑量和訓練強度 / 低 N/N」文字呈現，
# 改為週總覽卡的輕鬆/中等/強度色點 + 完成度環。beginner=低強度的意圖已由上方
# 「禁止 tempo/threshold/interval 類型」+「必須有輕鬆跑」充分把關，故移除已不存在的
# 文字斷言，避免誤判 app bug（改版前的 stale 斷言）。

# === 4. 七天完整 + 足夠休息日 ===
# 主課表頁每日清單用縮寫「週日」
- scrollUntilVisible:
    element: "星期日|週日"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: "休息"
    direction: UP
    timeout: 10000
