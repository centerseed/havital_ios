appId: com.havital.Havital.dev
tags:
  - weekly-summary
  - critical
---
# 測試：產生週回顧
# 前提：app 在主課表頁，有課表資料
# 用 Debug 工具觸發週回顧產生

- runFlow: ../subflows/ensure-main-training-screen.yaml

# 開選單 → Debug 工具 → 產生週回顧
- tapOn:
    id: "ellipsis.circle"
    optional: true
- tapOn:
    text: "更多|More|もっと見る"
    optional: true
- tapOn:
    text: "🐛 Debug 工具"
- tapOn: "🐛 產生週回顧"

# 等待產生（API + LLM 生成，可能需要 30 秒）
- extendedWaitUntil:
    visible: "訓練完成度|Completion|Training Completion"
    timeout: 45000

# 驗證週回顧第一頁核心欄位（完成度 / 亮點 / 分析）
- assertVisible: "本週亮點|Weekly Highlights"
- assertVisible: "訓練分析|Analysis|Training Analysis"

# 翻到第二頁「規劃下週」（週回顧為兩頁 TabView，水平翻頁；2 次 swipe 對最後一頁 no-op 無害）
- swipe:
    direction: LEFT
- waitForAnimationToEnd
- swipe:
    direction: LEFT
- waitForAnimationToEnd

# 第二頁必須有：下週調整建議 + 產生下週課表 CTA（所有目標型態皆有，非 race 專屬；
# 經 prod 截圖驗證 Beginner 帳號第二頁同樣渲染這兩者）
- assertVisible:
    text: "下週調整建議|Next Week Adjustments"
- assertVisible:
    text: "產生下週課表|接受調整並產生下週課表|不套用調整|Generate Next Week|Apply"

# 展開「下週調整建議」折疊區塊 → 內含內嵌 Rizo 多輪對話（懶載入，不自動開場）
- tapOn:
    text: "下週調整建議"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "rizo_chat_input"
    direction: DOWN
    timeout: 15000
    centerElement: true
- assertVisible:
    id: "rizo_chat_input"
