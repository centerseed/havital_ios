appId: com.havital.Havital.dev
tags:
  - achievements
  - smoke
---
# 成就頁 smoke（2026-05-31 改寫）
#
# 原 "Task 13 Badge pin E2E" 已失效：pin 徽章到首頁 + 課表頁徽章環的功能已從 app 移除
#   - AchievementDetailView 現在只有「分享 / 完成」按鈕，無 pin button
#   - 無 achievement.pin_button / achievement.hero_artwork / Achievements_BadgeLibraryEntry / v2.weekly.badge_ring
# 因此改寫為「成就頁可正常開啟並渲染」的 smoke，移除所有測已移除功能的斷言。
# 開徽章詳情→分享的視覺驗證由 verify-real-climate-badge.yaml 及手動 QA 覆蓋。

- runFlow: ../subflows/ensure-main-training-screen.yaml

- takeScreenshot: achievements_01_training_tab

# 進入成就 tab
- tapOn:
    text: "成就|Awards|実績"

- extendedWaitUntil:
    visible:
      text: "個人成就|Personal Achievement|個人実績"
    timeout: 15000

- takeScreenshot: achievements_02_overview

# PB 區塊（id 穩定）應渲染
- assertVisible:
    id: "Achievements_PBSection"

# 徽章收藏區應渲染（往下捲動找標題）
- scrollUntilVisible:
    element:
      text: "徽章收藏|Badge Library|バッジコレクション|Badge Collection"
    direction: DOWN
    timeout: 15000

- takeScreenshot: achievements_03_badge_collection
