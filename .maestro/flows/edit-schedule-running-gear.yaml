appId: com.havital.Havital.dev
tags:
  - edit
  - critical
  - regression
---
# 測試：跑步日 gear → 開跑步編輯器（不是 StrengthEditorV2）
# 驗收 DC-3：跑步日 gear 不開 strength editor

- runFlow: ../subflows/ensure-main-training-screen.yaml

- tapOn: "更多"
- tapOn: "編輯課表"
- assertVisible: "編輯週課表"

# 找第一個有跑步訓練的天（Day 2 可能是休息日無 gear）
# 試 Day 2 到 Day 7，找到第一個有 gear 的天
- tapOn:
    id: "day_2_edit_gear"
    optional: true
- tapOn:
    id: "day_3_edit_gear"
    optional: true

# 如果上面兩個都沒找到，等「編輯訓練」出現並確認
- extendedWaitUntil:
    visible: "編輯訓練"
    timeout: 5000
    optional: true

# 若未進入 gear editor，改試更多 day
- tapOn:
    id: "day_4_edit_gear"
    optional: true
- tapOn:
    id: "day_5_edit_gear"
    optional: true

# 確認進入了跑步日編輯 sheet
- extendedWaitUntil:
    visible: "編輯訓練"
    timeout: 10000
- waitForAnimationToEnd

# 確認是跑步編輯器：跑步日有距離設定（label 為 "距離 (公里)"）
- assertVisible: "距離.*公里|Distance.*km|輕鬆跑設定"

# 確認 gear 開啟了跑步編輯器（DC-3 核心驗收）

- tapOn: "取消"
- assertVisible: "編輯週課表"
- tapOn: "取消"
- tapOn:
    text: "放棄變更"
    optional: true
- assertVisible: "每日訓練"
