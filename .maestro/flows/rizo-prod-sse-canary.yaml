appId: com.havital.Havital
tags:
  - rizo
  - prod-canary
---
- launchApp:
    stopApp: true
    clearState: true
- runFlow:
    file: ../subflows/reviewer-demo-login.yaml
- tapOn:
    text: "稍後|Later|後で"
    optional: true
- runFlow:
    file: ../subflows/dismiss-permission-prompts.yaml
    optional: true
- extendedWaitUntil:
    visible: "今日狀態|Today's State|今日のコンディション"
    timeout: 30000
- tapOn:
    text: "今日狀態|Today's State|今日のコンディション"
- extendedWaitUntil:
    visible:
      id: "rizo_chat_input"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "rizo_chat_typing"
    timeout: 90000
- tapOn:
    id: "rizo_chat_input"
- inputText: "請先原樣輸出 STREAM-CANARY-20260713，再用三句話鼓勵我今天穩定訓練；不要修改課表。"
- hideKeyboard
- tapOn:
    id: "rizo_chat_send"
- extendedWaitUntil:
    visible: ".*STREAM-CANARY-20260713.*"
    timeout: 90000
- assertVisible:
    id: "rizo_chat_typing"
- takeScreenshot: rizo-ios-prod-streaming-partial
- extendedWaitUntil:
    notVisible:
      id: "rizo_chat_typing"
    timeout: 90000
- assertVisible: ".*STREAM-CANARY-20260713.*"
- assertNotVisible: "Rizo 暫時無法回應|Rizo is temporarily unavailable|Rizo は一時的に応答できません"
- takeScreenshot: rizo-ios-prod-streaming-final
