appId: com.havital.Havital.dev
tags:
  - rc
---
# RC 驗證：真實後台「刪週回顧 → 刪週課表 → 產週回顧 → 產週課表」
# 用 full-suite Phase 5 已驗證的「文字點選 Debug 選單」方式（非寫死座標）
- runFlow: ../subflows/ensure-main-training-screen.yaml
- extendedWaitUntil:
    visible:
      text: "每日訓練|週課表尚未產生|產生週課表"
    timeout: 30000

# Step 1: 刪除當前週回顧
- tapOn: "更多"
- tapOn:
    text: "🐛 Debug 工具"
- tapOn:
    text: "🗑️ 刪除當前週回顧"
    optional: true
- extendedWaitUntil:
    visible:
      text: "每日訓練|產生週課表|產生週回顧"
    timeout: 15000

# Step 2: 刪除當前週課表
- tapOn: "更多"
- tapOn:
    text: "🐛 Debug 工具"
- tapOn:
    text: "🗑️ 刪除當前週課表"
- extendedWaitUntil:
    visible:
      text: "產生週課表|產生週回顧|產生下週課表"
    timeout: 20000

# Step 3: 若需先產生週回顧（Week 2+）
- tapOn:
    text: "產生週回顧"
    optional: true
- extendedWaitUntil:
    visible:
      text: "訓練完成度|產生週課表|產生下週課表"
    timeout: 60000

# Step 4: 產生週課表（真實後台 LLM）
- tapOn:
    text: "產生下週課表|產生週課表"
- extendedWaitUntil:
    visible:
      text: "每日訓練|載入失敗|重試"
    timeout: 120000

# 驗證真實產出的 7 天課表
- assertVisible: "每日訓練"
- assertVisible: "星期一|週一"
- scrollUntilVisible:
    element: "星期日|週日"
    direction: DOWN
    timeout: 15000
- takeScreenshot: rc_weekly_regen_done
