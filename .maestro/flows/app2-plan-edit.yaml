appId: com.havital.Havital.dev
tags:
  - app2
---
# T-0306 —— 修改課表（設計 frame-03～09）的實走證據。
#
# **只走到「改了但不儲存」為止。** 這台模擬器登的是真的 dev 帳號，
# flow 不按儲存，避免把週課表改掉。`clearState: false`：不得清 keychain 或資料。
#
# ⚠️ 兩個 a11y 陷阱（2026-08-26 用 `maestro hierarchy` 確認，都寫在對應的 view 註解裡）：
# 1. 容器掛 `accessibilityIdentifier` 會蓋掉底下每一個子節點 —— 所以判斷「單日編輯開了沒」
#    用 top bar 的 `App2_DayEditTitle`，不是整頁的 id。
# 2. 整卡加手勢會把卡收成單一 a11y element；日卡靠 `.accessibilityElement(children: .contain)`
#    才留得住卡內的課型 chip 與齒輪鈕。

- launchApp:
    clearState: false
    arguments:
      "-skipHealthKitAuth": true

- tapOn:
    text: "知道了，不再顯示"
    optional: true

- extendedWaitUntil:
    visible:
      id: "App2_TrainingStatusCard"
    timeout: 120000

# 「…」選單 → 修改課表
- tapOn:
    id: "App2_HomeMenu"
- tapOn:
    text: "修改課表"
- extendedWaitUntil:
    visible:
      id: "App2_PlanEditSummary"
    timeout: 40000
- takeScreenshot: editfix-01-week

# 迴歸：**起手點落在日卡上**也要捲得動。
# 日卡佔畫面大部分面積，拖曳排序的手勢一旦掛在整列上就會吃掉 ScrollView 的 pan，
# 整頁完全捲不動（2026-08-26 實測，連 5 次 swipe 畫面零位移）。
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
- assertVisible: "週日"
- swipe:
    start: "50%, 30%"
    end: "50%, 85%"
- swipe:
    start: "50%, 30%"
    end: "50%, 85%"
- swipe:
    start: "50%, 30%"
    end: "50%, 85%"

# 課型選單 sheet（frame-04）
- tapOn:
    id: "App2_PlanEditType_3"
- extendedWaitUntil:
    visible:
      id: "App2_TrainingTypeSheet"
    timeout: 10000
- takeScreenshot: editfix-02-type-sheet
- swipe:
    start: "50%, 18%"
    end: "50%, 95%"

# 單日編輯 · 距離制間歇（frame-05）＋ 配速輪盤（frame-09）
- tapOn:
    id: "App2_PlanEditDetail_3"
- extendedWaitUntil:
    visible:
      id: "App2_DayEditTitle"
    timeout: 15000
- takeScreenshot: editfix-03-interval
- tapOn:
    text: "配速"
    index: 0
- takeScreenshot: editfix-04-pace-wheel
- swipe:
    start: "50%, 55%"
    end: "50%, 98%"
- tapOn:
    id: "App2_DayEditCancel"

# 單日編輯 · 休息日（frame-08）—— 休息日卡沒有齒輪鈕，整張卡就是入口
- tapOn:
    id: "App2_PlanEditDay_2"
- extendedWaitUntil:
    visible:
      id: "App2_DayEditTitle"
    timeout: 15000
- takeScreenshot: editfix-05-rest
- tapOn:
    id: "App2_DayEditCancel"

# 不儲存 —— 放棄變更，週課表維持原狀
- tapOn:
    id: "App2_PlanEditCancel"
- tapOn:
    text: "放棄變更"
    optional: true
