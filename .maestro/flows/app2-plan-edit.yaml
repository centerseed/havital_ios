appId: com.havital.Havital.dev
tags:
  - app2
---
# T-0306 wave3 §3 —— 編輯週課表（設計 frame-03～09）的實走證據。
#
# **只走到「改了但不儲存」為止。** 這台模擬器登的是創辦人本人的 dev 帳號，
# flow 不按儲存，避免把真的週課表改掉。
# `clearState: false`：不得清 keychain 或資料。
#
# ⚠️ 課型 sheet / 單日編輯 sheet 是**從 fullScreenCover 裡再開的 sheet**，
# SwiftUI 不把這一層曝進 accessibility tree（2026-08-25 用 `maestro hierarchy`
# 確認：編輯頁本身的 id 全在，sheet 內一個都沒有）。所以這幾步用座標點擊，
# 斷言則回到主層看得到的 id（換成間歇後日卡會長出 `App2_PlanEditDetail_2`）。

- launchApp:
    clearState: false
    arguments:
      "-skipHealthKitAuth": true

- tapOn:
    text: "知道了，不再顯示"
    optional: true

- extendedWaitUntil:
    visible:
      id: "App2_TrainingStatusCard"
    timeout: 60000

# 「…」選單 → 修改課表
- tapOn:
    id: "App2_HomeMenu"
- tapOn:
    text: "修改課表"
- extendedWaitUntil:
    visible:
      id: "App2_PlanEditSummary"
    timeout: 30000
- takeScreenshot: wave3-13-plan-edit-week

# 課型選單 sheet（frame-04）
- tapOn:
    id: "App2_PlanEditType_2"
- takeScreenshot: wave3-14-type-sheet
# 「間歇訓練」那一列（強度訓練組第三項）
- tapOn:
    point: "50%,87%"
- extendedWaitUntil:
    visible:
      id: "App2_PlanEditDetail_2"
    timeout: 15000
# 換成間歇後：跑量變了、日卡改成「編輯內容」摘要、相鄰強度日提醒可能出現
- takeScreenshot: wave3-15-after-type-change

# 單日細部編輯（frame-05 距離制間歇）
- tapOn:
    id: "App2_PlanEditDetail_2"
- takeScreenshot: wave3-16-interval-editor

# 不儲存 —— 這裡結束，週課表維持原狀
