# App2 週回顧時機卡 · §A.5 四態逐格走查 ＋ 週回顧兩頁
#
# 前置：先跑 `app2-weekly-review-walkthrough.yaml`（或自行進到開發工具）。
# 這一支每換一格 override 就回首頁截一張，最後從 CTA 進週回顧兩頁。
appId: com.havital.Havital.dev
---
# 冷啟：上一輪可能停在子頁上，`launchApp` 只是 resume。
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "App2_HomeView"
    timeout: 30000

# --- 「產生上週回顧」（平日） -------------------------------------------------
- runFlow:
    file: ../subflows/app2-open-weekly-review-dev.yaml
- tapOn:
    id: "App2_DevWeekReviewOverride_generatePreviousWeek"
- tapOn:
    id: "App2_WeeklyReviewDevBack"
# 回到設定頁時捲軸還停在開發者區，關閉鍵在頁首。
- scrollUntilVisible:
    element:
      id: "App2_SettingsClose"
    direction: UP
    timeout: 12000
- tapOn:
    id: "App2_SettingsClose"
- extendedWaitUntil:
    visible:
      id: "App2_HomeView"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "App2_WeekReviewEntry"
    direction: DOWN
    timeout: 12000
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-06-cta-generate-previous

# --- 「產生本週回顧」（週日） -------------------------------------------------
- runFlow:
    file: ../subflows/app2-open-weekly-review-dev.yaml
- tapOn:
    id: "App2_DevWeekReviewOverride_generateCurrentWeek"
- tapOn:
    id: "App2_WeeklyReviewDevBack"
# 回到設定頁時捲軸還停在開發者區，關閉鍵在頁首。
- scrollUntilVisible:
    element:
      id: "App2_SettingsClose"
    direction: UP
    timeout: 12000
- tapOn:
    id: "App2_SettingsClose"
- extendedWaitUntil:
    visible:
      id: "App2_HomeView"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "App2_WeekReviewEntry"
    direction: DOWN
    timeout: 12000
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-07-cta-generate-current

# --- 「查看回顧」 -------------------------------------------------------------
- runFlow:
    file: ../subflows/app2-open-weekly-review-dev.yaml
- tapOn:
    id: "App2_DevWeekReviewOverride_viewReview"
- tapOn:
    id: "App2_WeeklyReviewDevBack"
# 回到設定頁時捲軸還停在開發者區，關閉鍵在頁首。
- scrollUntilVisible:
    element:
      id: "App2_SettingsClose"
    direction: UP
    timeout: 12000
- tapOn:
    id: "App2_SettingsClose"
- extendedWaitUntil:
    visible:
      id: "App2_HomeView"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "App2_WeekReviewEntry"
    direction: DOWN
    timeout: 12000
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-08-cta-view-review

# --- 整卡隱藏 ---------------------------------------------------------------
- runFlow:
    file: ../subflows/app2-open-weekly-review-dev.yaml
- tapOn:
    id: "App2_DevWeekReviewOverride_hidden"
- tapOn:
    id: "App2_WeeklyReviewDevBack"
# 回到設定頁時捲軸還停在開發者區，關閉鍵在頁首。
- scrollUntilVisible:
    element:
      id: "App2_SettingsClose"
    direction: UP
    timeout: 12000
- tapOn:
    id: "App2_SettingsClose"
- extendedWaitUntil:
    visible:
      id: "App2_HomeView"
    timeout: 20000
- scroll
- scroll
- assertNotVisible:
    id: "App2_WeekReviewEntry"
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-09-cta-hidden

# --- 從 CTA 進週回顧兩頁 ------------------------------------------------------
- runFlow:
    file: ../subflows/app2-open-weekly-review-dev.yaml
- tapOn:
    id: "App2_DevWeekReviewOverride_generateCurrentWeek"
- tapOn:
    id: "App2_WeeklyReviewDevBack"
# 回到設定頁時捲軸還停在開發者區，關閉鍵在頁首。
- scrollUntilVisible:
    element:
      id: "App2_SettingsClose"
    direction: UP
    timeout: 12000
- tapOn:
    id: "App2_SettingsClose"
- extendedWaitUntil:
    visible:
      id: "App2_HomeView"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "App2_WeekReviewEntry"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "App2_WeekReviewEntry"
- assertVisible:
    id: "App2_WeeklyReviewView"
- extendedWaitUntil:
    visible:
      id: "App2_WeeklyReviewTab_review"
    timeout: 20000
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-10-review-tab
- tapOn:
    id: "App2_WeeklyReviewTab_plan"
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-11-plan-tab

# --- 頁內「產生週回顧」：後端的生成視窗未開 ---
#
# T-0362 改契約：**這一格不再有產生鈕**。
# 舊版在這裡 tapOn「產生週回顧」再等 `App2_WeeklyReviewError`——那正是使用者
# 2026-08-31 抱怨的形狀（「點進去還可以按產生,再說無法產生」）。後端平日只准產
# `current_week − 1`（`core/training_rules/plan_generation_window.py:37`),所以那顆鈕
# 必然 400。現在畫面直接說「這一週還不能產生回顧,要等這一週跑完。」,不給鈕。
- tapOn:
    id: "App2_WeeklyReviewTab_review"
- extendedWaitUntil:
    visible:
      id: "App2_WeeklyReviewWindowClosed"
    timeout: 20000
- assertVisible: "這一週還不能產生回顧，要等這一週跑完。"
- assertNotVisible:
    id: "App2_WeeklyReviewGenerate"
- takeScreenshot: /Users/wubaizong/havital/STATUS/evidence/T-0306/wr-12-generate-window-closed
