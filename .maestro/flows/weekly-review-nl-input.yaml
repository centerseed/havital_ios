appId: com.havital.Havital.dev
tags:
  - weekly-summary
  - rizo
# 測試：週回顧自由文字 NL 輸入（延後改下週課表入口，T-0029）
# 前提：app 已登入、帳號在 dev 有訓練計畫資料
# 流程：回每日訓練根頁 → Debug 工具產生週回顧 → 捲到自由輸入子區塊 → 打字 → 送出 → 斷言 Rizo 即時回應
---
- launchApp:
    stopApp: true
    clearState: false
    arguments:
      -skipHealthKitAuth: "true"

# 關閉可能的彈窗
- tapOn:
    id: "AnnouncementPopup_CloseButton"
    optional: true
- tapOn:
    text: "不允許|Don't Allow|Don’t Allow|許可しない|稍後|Later|後で|好|OK"
    optional: true

# 點底部 Plan tab 回到「每日訓練」根頁（若停在訓練總覽子頁，這會 pop 回根）
- tapOn:
    text: "Plan|計劃|計畫|プラン"
    optional: true
- tapOn:
    text: "Plan|計劃|計畫|プラン"
    optional: true

# 確認在每日訓練根頁（有「...」選單）
- extendedWaitUntil:
    visible:
      id: "ellipsis.circle"
    timeout: 15000

# 開「...」選單 → Debug 工具 → 產生週回顧（debug 標籤硬編碼中文）
- tapOn:
    id: "ellipsis.circle"
- tapOn:
    text: "更多|More|もっと見る"
    optional: true
- tapOn:
    text: "🐛 Debug 工具"
- tapOn: "🐛 產生週回顧"

# 等待週回顧生成（API + LLM，可能需 60 秒）
- extendedWaitUntil:
    visible: "訓練完成度|Completion|Training Completion"
    timeout: 60000

# 展開「下週調整建議」（若為摺疊式）
- tapOn:
    text: "下週調整建議|Next Week Adjustments"
    optional: true

# 捲到自由文字輸入框（id-based，語言無關）
- scrollUntilVisible:
    element:
      id: "weekly_nl_input"
    direction: DOWN
    timeout: 15000
- takeScreenshot: nl_input_visible

# 打字 → 收鍵盤（鍵盤工具列「完成」，讓送出按鈕脫離鍵盤遮擋）→ 送出
- tapOn:
    id: "weekly_nl_input"
- inputText: "下週五六爬山不能跑，想多休息"
- tapOn:
    id: "weekly_nl_keyboard_done"
- takeScreenshot: nl_input_typed
- tapOn:
    id: "weekly_nl_submit"

# 斷言 Rizo 即時回應出現（送出→/v2/agent/chat weekly_situation→回覆 round-trip）
- extendedWaitUntil:
    visible:
      id: "weekly_nl_reply"
    timeout: 60000
- takeScreenshot: nl_reply_visible
