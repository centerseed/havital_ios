appId: com.havital.Havital.dev
# T-0259 回歸防線：週回顧單頁揭示。
#
# 這條 flow 的存在理由：2026-06 的 fb8d9daa 把週回顧拆成兩頁，
# 導致「產生下週課表」CTA 在第一層、它要套用的內容（下週型態、跑量、調整項目）
# 藏在「翻頁 + 展開」兩層之下。使用者按下去之前看不到系統替他做的決定。
#
# 因此本 flow 的斷言鐵律：**不做任何 swipe、不點任何展開鈕**，
# 只允許在同一頁內捲動。若有人再把這些內容折疊或移到第二頁，這條會紅。
#
# 前提：已登入 dev 帳號、該帳號有可產生週回顧的訓練計畫。
---
- launchApp: { stopApp: true, clearState: false, arguments: { -skipHealthKitAuth: "true" } }
- tapOn: { id: "AnnouncementPopup_CloseButton", optional: true }
- tapOn: { text: "不允許|Don't Allow|Don’t Allow|許可しない|稍後|Later|後で|好|OK", optional: true }
- tapOn: { text: "Plan|計劃|計畫|プラン", optional: true }
- tapOn: { text: "Plan|計劃|計畫|プラン", optional: true }
- extendedWaitUntil: { visible: { id: "ellipsis.circle" }, timeout: 15000 }
- tapOn: { id: "ellipsis.circle" }
- tapOn: { text: "更多|More|もっと見る", optional: true }
- tapOn: "🐛 Debug 工具"
- tapOn: "🐛 產生週回顧"
- extendedWaitUntil: { visible: "訓練完成度|Completion|Training Completion", timeout: 90000 }

# 單頁：不得再有分頁切換控制
- assertNotVisible: { id: "v2.summary.page_picker" }
- assertNotVisible: { id: "v2.summary.continue_to_plan_button" }
- takeScreenshot: /private/tmp/claude-502/-Users-wubaizong-havital/6c1a05b1-3d97-435b-aab0-5aff97254b3c/scratchpad/wr_single_top

# 下週型態揭示：只靠捲動就要看得到（不 swipe、不展開）
- scrollUntilVisible:
    element:
      id: "v2.summary.next_week_outlook"
    direction: DOWN
    timeout: 20000
- takeScreenshot: /private/tmp/claude-502/-Users-wubaizong-havital/6c1a05b1-3d97-435b-aab0-5aff97254b3c/scratchpad/wr_single_outlook

# 下週調整建議：常駐攤開，不需點任何折疊鈕
- assertNotVisible: { id: "v2.summary.next_week_toggle" }
- scrollUntilVisible:
    element:
      text: "下週調整建議|Next Week Adjustments|来週の調整提案"
    direction: DOWN
    timeout: 20000
- takeScreenshot: /private/tmp/claude-502/-Users-wubaizong-havital/6c1a05b1-3d97-435b-aab0-5aff97254b3c/scratchpad/wr_single_adjustments
