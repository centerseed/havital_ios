appId: com.havital.Havital.dev
tags:
  - quality
  - weekly-plan
---
# 週課表品質驗證（獨立 flow）
# 前提：App 已登入且有課表資料

- runFlow: ../subflows/ensure-main-training-screen.yaml

# 主課表頁用縮寫「週一」；同時接受「星期一」及英日語
- scrollUntilVisible:
    element:
      text: "星期一|週一|Monday|月曜日"
    direction: DOWN
    timeout: 10000

- runFlow: ../subflows/verify-plan-quality.yaml
