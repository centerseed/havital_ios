appId: com.havital.Havital.dev
tags:
  - app2
---
# T-0306 — 2.0 骨架：冷啟 → 四個 tab 逐一切換不 crash → 從課表頁頭像開設定。
#
# 用 `-ui_testing_app2` 直接掛 App2RootView，跳過 auth／onboarding
# （沿用 repo 既有的 -ui_testing_* harness 慣例）。此模式沒有 token，
# 各區塊會依 App2DataOrigin 退到樣本並在畫面上掛「樣本」徽章。
#
# 已登入的真實資料路徑走正常啟動（ContentView → 同一支 App2RootView），
# 本 flow 不涵蓋——見票面「dev 真資料驗證」。
#
# **tab 是懸浮膠囊（`App2TabBar`），不是系統 TabView**（2026-08-25 視覺對齊）。
# 第四格是**成就**；設定不再是 tab，入口是課表頁右上角的頭像（設計 frame-01／21）。
#
# 斷言一律用**卡片**或 **tab 文字**的 accessibilityIdentifier，不用畫面容器的：
# SwiftUI 不把容器 identifier 曝進 accessibility tree（2026-08-25 用 maestro 的
# hierarchy dump 確認：`App2_HomeView`／`App2_PlanView`／`App2_TabBar` 都抓不到，
# 只有葉節點與有背景的卡片抓得到）。tab 也**不能用文字選** —— 首頁今日課表卡裡
# 就有「課表」兩個字，會先被選中；所以 tab 的 id 掛在標籤的 `Text` 上。

- launchApp:
    clearState: false
    arguments:
      "-ui_testing_app2": true
      "-skipHealthKitAuth": true

# === 狀態（首頁 §3.1／§3.1a） ===
- extendedWaitUntil:
    visible:
      id: "App2_Tab_State"
    timeout: 20000
# 目標賽事卡要等：它先打 `/user/targets` 把快取填起來才決定 live／樣本，
# 在這個沒有 token 的 harness 下必須等那次呼叫失敗才會落到樣本。
- extendedWaitUntil:
    visible:
      id: "App2_GoalCard"
    timeout: 30000
- assertVisible:
    id: "App2_TrainingStatusCard"
- assertVisible:
    id: "App2_LevelBadge"
- takeScreenshot: app2-01-home

# 首頁 v2：LV 徽章在訓練狀況卡裡（不再是 header 的設定入口），
# 指標區預設只展開最值得看的 2–3 列，其餘收在 `App2_InsightHandle` 後面。

# 首頁下半（今日課表卡 ＋ 週回顧／Rizo 入口）
- scroll
- scroll
- assertVisible:
    id: "App2_WeekReviewEntry"
- takeScreenshot: app2-01c-home-lower

# === 課表（§3.3） ===
- tapOn:
    id: "App2_Tab_Plan"
- extendedWaitUntil:
    visible:
      id: "App2_PlanSummaryCard"
    timeout: 15000
- assertVisible:
    id: "App2_SettingsEntry"
- takeScreenshot: app2-02-plan

# === 設定（§3.9a）—— 從課表頁右上角頭像進入，不是 tab ===
- tapOn:
    id: "App2_SettingsEntry"
- extendedWaitUntil:
    visible:
      id: "App2_SettingsAccountCard"
    timeout: 15000
- assertVisible:
    id: "App2_SettingsDataSourceCard"
- takeScreenshot: app2-02b-settings
- tapOn:
    id: "App2_SettingsClose"
- extendedWaitUntil:
    visible:
      id: "App2_PlanSummaryCard"
    timeout: 15000

# === 紀錄（§3.6） ===
- tapOn:
    id: "App2_Tab_Records"
- extendedWaitUntil:
    visible:
      id: "App2_RecordsTotalsCard"
    timeout: 15000
# 近 8 週趨勢是 hero 卡內的一段（沒有自己的背景），不曝進 a11y tree；
# 改斷言有背景的每筆紀錄卡。
- assertVisible:
    id: "App2_RecordRow"
- takeScreenshot: app2-03-records

# === 成就（設計 frame-11）===
# 資料走既有的 `GET /v2/achievements/summary`；此 harness 沒有 token，
# 所以只斷言頁面掛得起來、切回去不 crash。
- tapOn:
    id: "App2_Tab_Achievements"
- extendedWaitUntil:
    visible:
      id: "App2_Tab_State"
    timeout: 15000
- takeScreenshot: app2-04-achievements

# === 回到狀態，確認來回切換不 crash ===
# 切回來時 SwiftUI 保留捲動位置，所以先捲回頂再斷言目標賽事卡。
- tapOn:
    id: "App2_Tab_State"
- extendedWaitUntil:
    visible:
      id: "App2_Tab_State"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "App2_GoalCard"
    direction: UP
    timeout: 15000
- assertVisible:
    id: "App2_GoalCard"
- takeScreenshot: app2-05-home-return
