appId: com.havital.Havital.dev
tags:
  - app2
---
# T-0306 — 2.0 骨架：冷啟 → 四個 tab 逐一切換不 crash。
#
# 用 `-ui_testing_app2` 直接掛 App2RootView，跳過 auth／onboarding
# （沿用 repo 既有的 -ui_testing_* harness 慣例）。此模式沒有 token，
# 各區塊會依 App2DataOrigin 退到樣本並在畫面上掛「樣本」徽章。
#
# 已登入的真實資料路徑走正常啟動（ContentView → 同一支 App2RootView），
# 本 flow 不涵蓋——dev 憑證取得方式見票面卡點。
#
# 斷言一律用**卡片**的 accessibilityIdentifier，不用畫面容器的：
# SwiftUI 的 ScrollView 不會把 identifier 曝進 accessibility tree
# （2026-08-25 實測，`App2_HomeView`／`App2_PlanView` 都抓不到）。
# 同理 tab 用文字點，非選中的 tabItem 只曝 SF Symbol 名。

- launchApp:
    clearState: false
    arguments:
      "-ui_testing_app2": true
      "-skipHealthKitAuth": true

# === 狀態（首頁 §3.1／§3.1a） ===
- extendedWaitUntil:
    visible:
      id: "App2_RootView"
    timeout: 20000
- assertVisible:
    id: "App2_GoalCard"
- assertVisible:
    id: "App2_TrainingStatusCard"
- assertVisible:
    id: "App2_LevelBadge"
- takeScreenshot: app2-01-home

# 首頁下半（今日課表卡 ＋ 意圖卡 ＋ 入口）
- scroll
- scroll
- assertVisible:
    id: "App2_IntentCard"
- takeScreenshot: app2-01b-home-intent

# === 課表（§3.3） ===
- tapOn:
    text: "課表"
- extendedWaitUntil:
    visible:
      id: "App2_PlanSummaryCard"
    timeout: 15000
- assertVisible:
    id: "App2_PlanDaysCard"
- takeScreenshot: app2-02-plan

# === 紀錄（§3.6） ===
- tapOn:
    text: "紀錄"
- extendedWaitUntil:
    visible:
      id: "App2_RecordsTotalsCard"
    timeout: 15000
- assertVisible:
    id: "App2_RecordsWeeklyCard"
- takeScreenshot: app2-03-records

# === 設定（§3.9a） ===
- tapOn:
    text: "設定"
- extendedWaitUntil:
    visible:
      id: "App2_SettingsAccountCard"
    timeout: 15000
- assertVisible:
    id: "App2_SettingsDataSourceCard"
- takeScreenshot: app2-04-settings

# === 回到狀態，確認來回切換不 crash ===
# 切回來時 SwiftUI 保留捲動位置（仍停在意圖卡那一段），所以先捲回頂再斷言目標賽事卡。
- tapOn:
    text: "狀態"
- extendedWaitUntil:
    visible:
      id: "App2_RootView"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "App2_GoalCard"
    direction: UP
    timeout: 15000
- assertVisible:
    id: "App2_GoalCard"
- takeScreenshot: app2-05-home-return
